name: Revenue OS / protected local CRM
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python 3.12 / security and accounting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned-range runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py core.py tests
      - name: Security, CRM, API and business logic
        run: python -m pytest -q
      - name: Verify full product entrypoints
        run: |
          test -s dashboard/index.html
          test -s docs/OFERTA-Y-MENSAJES.md
          test -s docs/SISTEMA-COMERCIAL-7-DIAS.md
          test -s .env.example
